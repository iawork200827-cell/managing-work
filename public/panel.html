<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Panel del dueño</title>
  <link rel="icon" type="image/png" sizes="48x48" href="/img/icon-48.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/img/icon-192.png">
  <link rel="apple-touch-icon" href="/img/icon-180.png">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand">
        <span class="label">Panel del dueño</span>
        <h1 id="shopName">Panel</h1>
      </div>
      <div class="no-print" style="display:flex;gap:6px;flex-wrap:wrap">
        <span id="roleTag" class="muted" style="align-self:center"></span>
        <a class="switch-link" href="/empleados">Tomar pedido</a>
        <button id="soundBtn" hidden>Activar sonido de pedidos</button>
        <button id="logoutBtn" hidden>Cerrar sesión</button>
      </div>
    </header>
    <div id="notice" class="notice" hidden></div>
    <main id="app"><p class="muted">Cargando…</p></main>
  </div>
  <script type="module" src="js/panel.js"></script>
</body>
</html>
