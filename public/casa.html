<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <title>Pedir desde casa</title>
  <link rel="icon" type="image/png" sizes="48x48" href="/img/icon-48.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/img/icon-192.png">
  <link rel="apple-touch-icon" href="/img/icon-180.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Tacos Josué">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script>if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));</script>
  <meta name="description" content="Pide desde casa: domicilio gratis o pasa a recoger.">
  <link rel="stylesheet" href="/css/teaser.css">
  <script>(function(){var h=document.documentElement;try{if(/[?&]ver=todo/.test(location.search))sessionStorage.setItem("tj.ver","1");if(sessionStorage.getItem("tj.ver"))return}catch(e){}h.classList.add("cs")})();</script>
  <script type="module" src="/js/teaser.js"></script>
</head>
<body data-mode="casa">
  <div class="wrap">
    <header class="top">
      <div class="brand">
        <span class="label" id="eyebrow">Pedir desde casa</span>
        <h1 id="shopName">Tacos Josué</h1>
      </div>
      <a class="switch-link" href="/">Inicio</a>
    </header>
    <div id="notice" class="notice" hidden></div>
    <main id="app"><p class="muted">Cargando el menú…</p></main>
  </div>
  <div id="cartbar" class="cartbar" hidden></div>
  <script type="module" src="js/menu.js"></script>
</body>
</html>
