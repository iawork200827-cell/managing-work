name: Publicar app en Firebase

# Publica el menú, el panel y las reglas de seguridad cada vez que cambia el código de la app.
on:
  push:
    branches:
      - main
      - claude/amazing-noether-dj9gk7
    paths:
      - "public/**"
      - "firestore.rules"
      - "firestore.indexes.json"
      - "firebase.json"
      - ".firebaserc"
      - ".github/workflows/deploy-firebase.yml"
      - ".github/scripts/revisar-sitio.cjs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: actions/setup-node@v4.1.0
        with:
          node-version: 20

      - name: Publicar en Firebase
        env:
          # Se revisan todos los secretos disponibles y se usa el que sea la llave
          # de cuenta de servicio del proyecto, sin importar cómo se llame.
          ALL_SECRETS: ${{ toJSON(secrets) }}
          PROJECT_ID: tacos-josue
        run: |
          KEY_NAME=$(printf '%s' "$ALL_SECRETS" | jq -r --arg p "$PROJECT_ID" '
            to_entries[]
            | select(.key != "github_token")
            | select((.value | fromjson? // {}) | (.type == "service_account" and .project_id == $p))
            | .key' | head -n1)
          if [ -z "$KEY_NAME" ]; then
            echo "::warning::No encontré la llave de cuenta de servicio de $PROJECT_ID en los secretos de Actions. No se publicó nada."
            echo "Secretos visibles para este flujo (solo nombres):"
            printf '%s' "$ALL_SECRETS" | jq -r 'keys[]'
            exit 0
          fi
          echo "Usando la llave guardada en el secreto: $KEY_NAME"
          printf '%s' "$ALL_SECRETS" | jq -r --arg k "$KEY_NAME" '.[$k]' > "$RUNNER_TEMP/sa.json"
          unset ALL_SECRETS
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@13.29.1 deploy --only hosting,firestore:rules --non-interactive --force
          rm -f "$RUNNER_TEMP/sa.json"

      - name: Revisar el sitio publicado
        if: always()
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.49.1
          node .github/scripts/revisar-sitio.cjs
